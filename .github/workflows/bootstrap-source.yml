name: Bootstrap Northstar source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/source.part* > /tmp/northstar-source.b64
          base64 --decode /tmp/northstar-source.b64 > /tmp/northstar-source.tar.xz
          tar -xJf /tmp/northstar-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Publish complete source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: publish complete Northstar Loop application"
          git push origin HEAD:main
